<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 날씨 ☀️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#0086D6;
    --sky-light:#3AA8EA;
    --sky-deep:#0072B8;
    --white:#FFFFFF;
    --yellow:#FEC600;
    --ink:#0B4A73;
    --ink-soft:#5A93B8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Noto Sans KR',sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg, var(--sky) 0%, var(--sky-light) 55%, var(--sky-deep) 100%);
    overflow-x:hidden;
    position:relative;
  }
  .cloud{
    position:absolute; opacity:0.9;
    filter:drop-shadow(0 8px 14px rgba(0,60,100,0.10));
    z-index:0; animation:drift linear infinite;
  }
  @keyframes drift{ from{transform:translateX(-40px);} to{transform:translateX(40px);} }
  .cloud1{top:6%; left:-4%; width:150px; animation-duration:14s;}
  .cloud2{top:14%; right:-6%; width:110px; animation-duration:11s; animation-direction:alternate-reverse;}
  .cloud3{top:88%; left:-8%; width:130px; animation-duration:16s;}
  .cloud4{top:95%; right:-4%; width:90px; animation-duration:9s; animation-direction:alternate-reverse;}

  .wrap{ position:relative; z-index:1; max-width:480px; margin:0 auto; padding:32px 20px 48px; }

  .topbar{ display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:28px; }
  .topbar .logo{ font-family:'Jua',sans-serif; font-size:20px; color:var(--white); }
  .topbar .logo-dot{ width:8px;height:8px;border-radius:50%; background:var(--yellow); }

  #state{
    background:var(--white); border-radius:32px; padding:44px 28px; text-align:center;
    box-shadow:0 16px 40px rgba(0,50,90,0.18);
  }
  #state h2{ font-family:'Jua',sans-serif; font-size:20px; margin:14px 0 8px; color:var(--sky); }
  #state p{ font-size:14px; color:var(--ink-soft); line-height:1.6; margin:0 0 20px; }
  .bounce-sun{ width:64px;height:64px; margin:0 auto; animation:bounce 1.2s ease-in-out infinite; }
  @keyframes bounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
  button{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px;
    background:var(--yellow); color:#7A4E00; border:none; padding:12px 26px;
    border-radius:999px; cursor:pointer; box-shadow:0 6px 0 #E0A800; transition:transform 0.1s;
  }
  button:active{transform:translateY(4px); box-shadow:0 2px 0 #E0A800;}

  #main{display:none;}
  .card{
    background:var(--white); border-radius:32px; padding:30px 26px 26px;
    box-shadow:0 16px 40px rgba(0,50,90,0.18); text-align:center;
  }
  .badge-row{ display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .badge{
    display:inline-block; font-size:11px; color:var(--ink-soft);
    background:#EAF6FF; border-radius:999px; padding:4px 10px;
  }
  .precise-btn{
    font-family:'Noto Sans KR',sans-serif; font-weight:500; font-size:11px;
    background:transparent; color:var(--sky); border:1px solid #CBE8FA;
    padding:4px 10px; border-radius:999px; box-shadow:none;
  }
  .precise-btn:active{ transform:none; box-shadow:none; background:#EAF6FF; }

  .place{ font-size:14px; font-weight:500; color:var(--ink-soft); margin-bottom:2px; }
  .place b{color:var(--sky); font-weight:700;}
  .date{ font-size:12px; color:var(--ink-soft); margin-bottom:18px; }
  .icon-wrap{ width:120px; height:120px; margin:0 auto 6px; }
  .icon-wrap svg{width:100%; height:100%;}
  .temp{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:72px; line-height:1; color:var(--sky); margin:6px 0 4px; }
  .condition{ font-family:'Jua',sans-serif; font-size:17px; color:var(--ink); margin-bottom:4px; }
  .range{ font-size:13px; color:var(--ink-soft); margin-bottom:22px; }
  .range .hi{color:#E4572E; font-weight:700;}
  .range .lo{color:var(--sky); font-weight:700;}

  .gauges{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:20px; }
  .gauge{ background:#EAF6FF; border-radius:18px; padding:12px 6px; }
  .gauge .g-icon{font-size:18px; margin-bottom:4px;}
  .gauge .g-label{font-size:10px; color:var(--ink-soft); margin-bottom:3px;}
  .gauge .g-val{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; color:var(--sky);}

  .sun-track{ background:#EAF6FF; border-radius:20px; padding:16px 18px 12px; margin-bottom:20px; }
  .sun-track-title{ font-size:11px; color:var(--ink-soft); margin-bottom:10px; text-align:left; }
  .sun-labels{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .sun-labels b{color:var(--ink); font-weight:700;}

  .week-title{ font-size:11px; color:var(--ink-soft); margin-bottom:10px; text-align:left; }
  .week{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .day{
    flex:1 0 56px; background:#EAF6FF; border-radius:16px; padding:10px 4px;
    text-align:center; cursor:pointer; border:2px solid transparent;
    transition:background 0.15s, border-color 0.15s;
  }
  .day:hover{ border-color:#CBE8FA; }
  .day.selected{ background:var(--yellow); }
  .day .d-name{ font-size:11px; font-weight:700; color:var(--ink-soft); margin-bottom:4px; }
  .day.selected .d-name{ color:#7A4E00; }
  .day .d-icon{ width:30px; height:30px; margin:0 auto 4px; }
  .day .d-icon svg{width:100%; height:100%;}
  .day .d-hi{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px; color:var(--sky); }
  .day.selected .d-hi{ color:#7A4E00; }
  .day .d-lo{ font-size:11px; color:var(--ink-soft); }
  .day.selected .d-lo{ color:#946600; }

  footer{ text-align:center; font-size:11px; color:rgba(255,255,255,0.8); margin-top:18px; }

  @media (max-width:380px){
    .temp{font-size:58px;}
    .icon-wrap{width:96px; height:96px;}
  }
</style>
</head>
<body>

  <svg class="cloud cloud1" viewBox="0 0 200 110" xmlns="http://www.w3.org/2000/svg"><path d="M40 80 Q10 80 10 55 Q10 30 35 30 Q40 8 68 8 Q95 8 100 30 Q125 25 130 48 Q155 48 155 68 Q155 88 130 88 L45 88 Q40 88 40 80 Z" fill="#ffffff"/></svg>
  <svg class="cloud cloud2" viewBox="0 0 200 110" xmlns="http://www.w3.org/2000/svg"><path d="M40 80 Q10 80 10 55 Q10 30 35 30 Q40 8 68 8 Q95 8 100 30 Q125 25 130 48 Q155 48 155 68 Q155 88 130 88 L45 88 Q40 88 40 80 Z" fill="#ffffff"/></svg>
  <svg class="cloud cloud3" viewBox="0 0 200 110" xmlns="http://www.w3.org/2000/svg"><path d="M40 80 Q10 80 10 55 Q10 30 35 30 Q40 8 68 8 Q95 8 100 30 Q125 25 130 48 Q155 48 155 68 Q155 88 130 88 L45 88 Q40 88 40 80 Z" fill="#ffffff"/></svg>
  <svg class="cloud cloud4" viewBox="0 0 200 110" xmlns="http://www.w3.org/2000/svg"><path d="M40 80 Q10 80 10 55 Q10 30 35 30 Q40 8 68 8 Q95 8 100 30 Q125 25 130 48 Q155 48 155 68 Q155 88 130 88 L45 88 Q40 88 40 80 Z" fill="#ffffff"/></svg>

  <div class="wrap">
    <div class="topbar">
      <span class="logo-dot"></span>
      <span class="logo">오늘 날씨</span>
    </div>

    <div id="state">
      <svg class="bounce-sun" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="22" fill="#FEC600"/>
        <g stroke="#FEC600" stroke-width="5" stroke-linecap="round">
          <line x1="50" y1="8" x2="50" y2="18"/><line x1="50" y1="82" x2="50" y2="92"/>
          <line x1="8" y1="50" x2="18" y2="50"/><line x1="82" y1="50" x2="92" y2="50"/>
          <line x1="20" y1="20" x2="27" y2="27"/><line x1="73" y1="73" x2="80" y2="80"/>
          <line x1="80" y1="20" x2="73" y2="27"/><line x1="27" y1="73" x2="20" y2="80"/>
        </g>
      </svg>
      <h2 id="state-title">위치를 찾는 중</h2>
      <p id="state-msg">잠시만 기다려주세요</p>
      <div id="state-btn"></div>
    </div>

    <div id="main">
      <div class="card">
        <div class="badge-row">
          <span class="badge" id="loc-badge">📍 GPS 위치</span>
          <button class="precise-btn" id="precise-btn" onclick="requestPrecise()">🎯 정확한 위치로 확인</button>
        </div>
        <div class="place" id="location">위치 확인 중…</div>
        <div class="date" id="today-date">—</div>

        <div class="icon-wrap" id="weather-icon"></div>
        <div class="temp" id="temp">—°</div>
        <div class="condition" id="condition">—</div>
        <div class="range" id="range">최고 <span class="hi">—</span> · 최저 <span class="lo">—</span></div>

        <div class="gauges">
          <div class="gauge"><div class="g-icon">🤗</div><div class="g-label">체감</div><div class="g-val" id="feels">—°</div></div>
          <div class="gauge"><div class="g-icon" id="g2-icon">💧</div><div class="g-label" id="g2-label">습도</div><div class="g-val" id="humidity">—%</div></div>
          <div class="gauge"><div class="g-icon">🍃</div><div class="g-label">바람</div><div class="g-val" id="wind">—</div></div>
          <div class="gauge"><div class="g-icon">☔</div><div class="g-label">강수</div><div class="g-val" id="precip">—</div></div>
        </div>

        <div class="sun-track">
          <div class="sun-track-title">해가 뜨고 지는 시간</div>
          <svg viewBox="0 0 380 90" width="100%" height="auto">
            <path d="M 20 78 Q 190 -6 360 78" fill="none" stroke="#CBE8FA" stroke-width="4" stroke-linecap="round"/>
            <circle id="sun-dot" cx="20" cy="78" r="10" fill="#FEC600"/>
          </svg>
          <div class="sun-labels">
            <span>🌅 <b id="sunrise">—</b></span>
            <span>🌇 <b id="sunset">—</b></span>
          </div>
        </div>

        <div class="week-title">이번 주 예보 (날짜를 눌러보세요)</div>
        <div class="week" id="week"></div>
      </div>

      <footer>
        <span id="coords">—</span> · <span id="updated">—</span>
      </footer>
    </div>
  </div>

<script>
const WEATHER_TEXT = {
  0:'맑음', 1:'대체로 맑음', 2:'구름 조금', 3:'흐림',
  45:'안개', 48:'짙은 안개',
  51:'약한 이슬비', 53:'이슬비', 55:'강한 이슬비',
  56:'착빙성 이슬비', 57:'강한 착빙성 이슬비',
  61:'약한 비', 63:'비', 65:'강한 비',
  66:'착빙성 비', 67:'강한 착빙성 비',
  71:'약한 눈', 73:'눈', 75:'강한 눈',
  77:'싸락눈',
  80:'약한 소나기', 81:'소나기', 82:'강한 소나기',
  85:'약한 소나기눈', 86:'소나기눈',
  95:'뇌우', 96:'우박 동반 뇌우', 99:'강한 우박 동반 뇌우'
};

function weatherIcon(code){
  const sun = `<circle cx="50" cy="50" r="24" fill="#FEC600"/>
    <g stroke="#FEC600" stroke-width="6" stroke-linecap="round">
      <line x1="50" y1="4" x2="50" y2="16"/><line x1="50" y1="84" x2="50" y2="96"/>
      <line x1="4" y1="50" x2="16" y2="50"/><line x1="84" y1="50" x2="96" y2="50"/>
      <line x1="18" y1="18" x2="26" y2="26"/><line x1="74" y1="74" x2="82" y2="82"/>
      <line x1="82" y1="18" x2="74" y2="26"/><line x1="26" y1="74" x2="18" y2="82"/>
    </g>
    <circle cx="43" cy="46" r="3" fill="#7A4E00"/><circle cx="58" cy="46" r="3" fill="#7A4E00"/>
    <path d="M42 58 Q50 65 58 58" stroke="#7A4E00" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const cloud = `<ellipse cx="50" cy="66" rx="34" ry="16" fill="#CBE8FA"/>
    <circle cx="34" cy="54" r="16" fill="#EAF6FF"/><circle cx="55" cy="46" r="20" fill="#EAF6FF"/><circle cx="72" cy="56" r="14" fill="#EAF6FF"/>
    <circle cx="46" cy="64" r="3" fill="#5A93B8"/><circle cx="58" cy="64" r="3" fill="#5A93B8"/>
    <path d="M46 74 Q52 79 58 74" stroke="#5A93B8" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const sunCloud = `<circle cx="62" cy="34" r="16" fill="#FEC600"/>
    <g stroke="#FEC600" stroke-width="4" stroke-linecap="round">
      <line x1="62" y1="8" x2="62" y2="14"/><line x1="84" y1="16" x2="80" y2="20"/><line x1="90" y1="34" x2="84" y2="34"/>
    </g>
    <ellipse cx="46" cy="68" rx="32" ry="15" fill="#CBE8FA"/>
    <circle cx="32" cy="56" r="14" fill="#EAF6FF"/><circle cx="50" cy="50" r="18" fill="#EAF6FF"/><circle cx="66" cy="58" r="12" fill="#EAF6FF"/>
    <circle cx="42" cy="66" r="3" fill="#5A93B8"/><circle cx="53" cy="66" r="3" fill="#5A93B8"/>
    <path d="M42 76 Q47.5 80 53 76" stroke="#5A93B8" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const rain = `<ellipse cx="50" cy="46" rx="34" ry="16" fill="#CBE8FA"/>
    <circle cx="34" cy="34" r="16" fill="#EAF6FF"/><circle cx="55" cy="26" r="20" fill="#EAF6FF"/><circle cx="72" cy="36" r="14" fill="#EAF6FF"/>
    <g stroke="#3AA8EA" stroke-width="4" stroke-linecap="round">
      <line x1="36" y1="70" x2="32" y2="82"/><line x1="52" y1="70" x2="48" y2="86"/><line x1="68" y1="70" x2="64" y2="82"/>
    </g>`;
  const snow = `<ellipse cx="50" cy="46" rx="34" ry="16" fill="#CBE8FA"/>
    <circle cx="34" cy="34" r="16" fill="#EAF6FF"/><circle cx="55" cy="26" r="20" fill="#EAF6FF"/><circle cx="72" cy="36" r="14" fill="#EAF6FF"/>
    <g fill="#3AA8EA">
      <circle cx="34" cy="78" r="3.5"/><circle cx="50" cy="84" r="3.5"/><circle cx="66" cy="78" r="3.5"/>
    </g>`;
  const storm = `<ellipse cx="50" cy="42" rx="34" ry="16" fill="#A9C6D8"/>
    <circle cx="34" cy="30" r="16" fill="#CBE8FA"/><circle cx="55" cy="22" r="20" fill="#CBE8FA"/><circle cx="72" cy="32" r="14" fill="#CBE8FA"/>
    <path d="M52 60 L40 78 L50 78 L44 96 L64 72 L52 72 Z" fill="#FEC600"/>`;

  if([0].includes(code)) return `<svg viewBox="0 0 100 100">${sun}</svg>`;
  if([1,2].includes(code)) return `<svg viewBox="0 0 100 100">${sunCloud}</svg>`;
  if([3,45,48].includes(code)) return `<svg viewBox="0 0 100 100">${cloud}</svg>`;
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return `<svg viewBox="0 0 100 100">${rain}</svg>`;
  if([71,73,75,77,85,86].includes(code)) return `<svg viewBox="0 0 100 100">${snow}</svg>`;
  if([95,96,99].includes(code)) return `<svg viewBox="0 0 100 100">${storm}</svg>`;
  return `<svg viewBox="0 0 100 100">${sun}</svg>`;
}

const stateTitle = document.getElementById('state-title');
const stateMsg = document.getElementById('state-msg');
const stateBtn = document.getElementById('state-btn');
const stateBox = document.getElementById('state');
const main = document.getElementById('main');
const preciseBtn = document.getElementById('precise-btn');

let currentData = null; // { current, daily, place, lat, lon }
let selectedIndex = 0;

function showFatalError(title, msg){
  stateTitle.textContent = title;
  stateMsg.innerHTML = msg;
  stateBtn.innerHTML = '<button onclick="location.reload()">다시 시도하기</button>';
}

function toHM(iso){
  return new Date(iso).toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', hour12:false});
}

async function reverseGeocode(lat, lon){
  try{
    const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ko`);
    const data = await res.json();
    const city = data.city || data.locality || data.principalSubdivision || '';
    const region = data.principalSubdivision && data.principalSubdivision !== city ? data.principalSubdivision : '';
    return [city, region].filter(Boolean).join(', ') || '알 수 없는 위치';
  }catch(e){
    return '알 수 없는 위치';
  }
}

async function ipLocate(){
  const res = await fetch('https://ipapi.co/json/');
  if(!res.ok) throw new Error('ip locate failed');
  const data = await res.json();
  if(!data.latitude || !data.longitude) throw new Error('no coords');
  const place = [data.city, data.region].filter(Boolean).join(', ') || data.country_name || '알 수 없는 위치';
  return { lat:data.latitude, lon:data.longitude, place };
}

function renderWeek(daily){
  const week = document.getElementById('week');
  week.innerHTML = '';
  const todayStr = new Date().toISOString().slice(0,10);
  daily.time.forEach((dateStr, i) => {
    const isToday = dateStr === todayStr;
    const d = new Date(dateStr + 'T00:00:00');
    const wd = isToday ? '오늘' : d.toLocaleDateString('ko-KR', {weekday:'short'});
    const div = document.createElement('div');
    div.className = 'day';
    div.dataset.index = i;
    div.innerHTML = `
      <div class="d-name">${wd}</div>
      <div class="d-icon">${weatherIcon(daily.weather_code[i])}</div>
      <div class="d-hi">${Math.round(daily.temperature_2m_max[i])}°</div>
      <div class="d-lo">${Math.round(daily.temperature_2m_min[i])}°</div>
    `;
    div.addEventListener('click', () => showDay(i));
    week.appendChild(div);
  });
  updateWeekSelection();
}

function updateWeekSelection(){
  document.querySelectorAll('.day').forEach(el => {
    el.classList.toggle('selected', Number(el.dataset.index) === selectedIndex);
  });
}

function positionSunDot(sunriseIso, sunsetIso){
  const now = new Date();
  const sr = new Date(sunriseIso).getTime();
  const ss = new Date(sunsetIso).getTime();
  let frac = (now.getTime() - sr) / (ss - sr);
  frac = Math.max(0, Math.min(1, frac));
  const x = 20 + frac * (360 - 20);
  const y = 78 - Math.sin(frac * Math.PI) * 78;
  const dot = document.getElementById('sun-dot');
  dot.setAttribute('cx', x);
  dot.setAttribute('cy', y);
}

function showDay(i){
  if(!currentData) return;
  selectedIndex = i;
  updateWeekSelection();

  const daily = currentData.daily;
  const isToday = i === 0;
  const code = daily.weather_code[i];

  document.getElementById('weather-icon').innerHTML = weatherIcon(code);
  document.getElementById('condition').textContent = WEATHER_TEXT[code] || '알 수 없음';
  document.getElementById('range').innerHTML = `최고 <span class="hi">${Math.round(daily.temperature_2m_max[i])}°</span> · 최저 <span class="lo">${Math.round(daily.temperature_2m_min[i])}°</span>`;

  const dateLabel = new Date(daily.time[i] + 'T00:00:00').toLocaleDateString('ko-KR', {month:'long', day:'numeric', weekday:'long'});
  document.getElementById('today-date').textContent = isToday ? `오늘 · ${dateLabel}` : dateLabel;

  const g2icon = document.getElementById('g2-icon');
  const g2label = document.getElementById('g2-label');

  if(isToday && currentData.current){
    const cur = currentData.current;
    document.getElementById('temp').textContent = `${Math.round(cur.temperature_2m)}°`;
    document.getElementById('feels').textContent = `${Math.round(cur.apparent_temperature)}°`;
    g2icon.textContent = '💧'; g2label.textContent = '습도';
    document.getElementById('humidity').textContent = `${Math.round(cur.relative_humidity_2m)}%`;
    document.getElementById('wind').textContent = `${Math.round(cur.wind_speed_10m)}`;
    document.getElementById('precip').textContent = `${cur.precipitation}mm`;
    document.getElementById('sun-dot').style.display = '';
    positionSunDot(daily.sunrise[i], daily.sunset[i]);
  } else {
    document.getElementById('temp').textContent = `${Math.round(daily.temperature_2m_max[i])}°`;
    document.getElementById('feels').textContent = `${Math.round(daily.apparent_temperature_max[i])}°`;
    g2icon.textContent = '🌂'; g2label.textContent = '강수확률';
    document.getElementById('humidity').textContent = `${Math.round(daily.precipitation_probability_max[i] ?? 0)}%`;
    document.getElementById('wind').textContent = `${Math.round(daily.wind_speed_10m_max[i])}`;
    document.getElementById('precip').textContent = `${daily.precipitation_sum[i]}mm`;
    document.getElementById('sun-dot').style.display = 'none';
  }

  document.getElementById('sunrise').textContent = toHM(daily.sunrise[i]);
  document.getElementById('sunset').textContent = toHM(daily.sunset[i]);
}

async function loadWeather(lat, lon, placeNameOverride){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,precipitation,weather_code` +
    `&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,weather_code,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset` +
    `&timezone=auto&forecast_days=7`;

  const [weatherRes, placeName] = await Promise.all([
    fetch(url).then(r => { if(!r.ok) throw new Error('fail'); return r.json(); }),
    placeNameOverride ? Promise.resolve(placeNameOverride) : reverseGeocode(lat, lon)
  ]);

  currentData = {
    current: weatherRes.current,
    daily: weatherRes.daily,
    place: placeName,
    lat, lon
  };

  document.getElementById('location').innerHTML = `<b>${placeName}</b>의 날씨`;
  document.getElementById('coords').textContent = `${lat.toFixed(3)}, ${lon.toFixed(3)}`;
  document.getElementById('updated').textContent = `업데이트 ${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}`;

  renderWeek(weatherRes.daily);
  showDay(0);

  stateBox.style.display = 'none';
  main.style.display = 'block';
}

async function useIpFallback(reasonMsg){
  try{
    stateMsg.textContent = reasonMsg;
    const loc = await ipLocate();
    document.getElementById('loc-badge').textContent = '📶 네트워크 기반 위치(대략)';
    await loadWeather(loc.lat, loc.lon, loc.place);
  }catch(e){
    showFatalError('위치를 확인할 수 없어요', '네트워크 상태를 확인한 뒤<br>다시 시도해 주세요.');
  }
}

// 사용자가 직접 눌러서 정확한 GPS 위치를 다시 요청 (IP 기반으로 떴을 때 특히 유용)
function requestPrecise(){
  if(!navigator.geolocation){
    preciseBtn.textContent = '이 브라우저는 GPS 미지원';
    return;
  }
  const original = preciseBtn.textContent;
  preciseBtn.textContent = '위치 확인 중…';
  preciseBtn.disabled = true;

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      document.getElementById('loc-badge').textContent = '📍 GPS 위치';
      try{
        await loadWeather(pos.coords.latitude, pos.coords.longitude);
      }catch(e){ /* ignore, keep previous data */ }
      preciseBtn.textContent = original;
      preciseBtn.disabled = false;
    },
    () => {
      preciseBtn.textContent = '권한을 허용해주세요';
      preciseBtn.disabled = false;
      setTimeout(() => { preciseBtn.textContent = original; }, 2500);
    },
    { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
  );
}

function init(){
  if(!navigator.geolocation){
    useIpFallback('GPS를 지원하지 않아 대략적인 위치로 불러오는 중…');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      document.getElementById('loc-badge').textContent = '📍 GPS 위치';
      try{
        await loadWeather(pos.coords.latitude, pos.coords.longitude);
      }catch(e){
        useIpFallback('정확한 위치 정보를 불러오지 못해 대략적인 위치로 다시 시도하는 중…');
      }
    },
    () => {
      useIpFallback('위치 권한이 없어 대략적인 위치로 불러오는 중…');
    },
    { enableHighAccuracy:true, timeout:8000, maximumAge:300000 }
  );
}

init();
</script>
